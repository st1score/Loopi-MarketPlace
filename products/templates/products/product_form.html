{% load i18n %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% trans "Добавить товар" %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg,rgb(94, 158, 255),rgb(112, 172, 255));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .card {
            background-color: rgba(56, 56, 255, 0.8);
            border-radius: 1rem;
            padding: 2rem;
            width: 100%;
            max-width: 600px;
        }
        label {
            color: #ffffffcc;
        }
    </style>
</head>
<body>
    <div class="card shadow">
        <h2 class="text-center mb-4">{% trans "Добавить товар" %}</h2>
        <form method="post" enctype="multipart/form-data" novalidate>
            {% csrf_token %}
            {% for field in form %}
                <div class="mb-3">
                    <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <div class="text-danger small">{{ field.errors }}</div>
                    {% endif %}
                </div>
            {% endfor %}
            <div class="d-grid">
                <button type="submit" class="btn btn-light text-dark fw-bold">{% trans "Сохранить" %}</button>
            </div>
        </form>
        <div class="mt-3 text-center">
            <a href="{% url 'product_list' %}" class="text-light text-decoration-none">⬅️ {% trans "Назад к списку" %}</a>
        </div>
    </div>
</body>
</html>
